[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-pursuit-referees"
version = "0.2.0"
description = "Independent mathematical and evidence referees with a deterministic merge"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
claude = ["anthropic>=0.49,<2"]

[tool.setuptools.package-data]
referees = ["prompts/*.md"]

[tool.setuptools.packages.find]
include = ["referees*"]
